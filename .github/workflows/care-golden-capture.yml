name: CARE 골든 기준값 캡처

# CARE(legacy/streamlit_app_actual_tou_v30.py)를 JS/TypeScript로 이관하기 전에
# "원본 파이썬이 실제로 무엇을 반환하는가"를 고정해 이관 후 결과와 대조하기 위한 것.
# PRAS-DER 저장소의 tests/golden/* 와 같은 목적.
#
# legacy/ 안의 원본 소스는 건드리지 않는다 — golden_capture.py 는 그것을 읽기만 하고,
# streamlit_app_actual_tou_v30.py 는 UI 시작 전(순수 계산 함수) 부분만 exec 해서 가져다 쓴다.
#
# 로컬(샌드박스) 환경은 정책상 ortools 설치가 막혀 있어 최적화 두 함수의 골든값을
# 캡처하지 못했다. GitHub Actions 러너는 PyPI 제한이 없으므로 여기서 전체를 다시 캡처한다.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    name: 골든값 캡처 + 커밋
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (legacy/requirements.txt 그대로)
        run: pip install -r legacy/requirements.txt

      - name: 골든값 캡처 실행
        run: python golden/golden_capture.py legacy/streamlit_app_actual_tou_v30.py golden/care-reference.json

      - name: 결과 확인 (오류 0건이어야 함)
        run: |
          python -c "
          import json
          d = json.load(open('golden/care-reference.json', encoding='utf-8'))
          errors = d.get('_errors', {})
          print('오류 건수:', len(errors))
          if errors:
              for k, v in errors.items():
                  print(f'--- {k} ---')
                  print(v)
              raise SystemExit(1)
          opt1 = d.get('transformer_optimization_cases')
          opt2 = d.get('action_optimization_cases')
          if isinstance(opt1, dict) and opt1.get('_status', '').startswith('unavailable'):
              raise SystemExit('transformer_optimization_cases 가 여전히 unavailable 입니다 — ortools 설치 확인 필요')
          if isinstance(opt2, dict) and opt2.get('_status', '').startswith('unavailable'):
              raise SystemExit('action_optimization_cases 가 여전히 unavailable 입니다 — ortools 설치 확인 필요')
          print('전체 정상 — 최적화 케이스 포함 완료')
          "

      - name: 저장소에 커밋
        run: |
          git config user.name "care-golden-capture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add golden/care-reference.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: CARE 골든 기준값 재캡처 (ortools 포함)"
            git push
          fi
