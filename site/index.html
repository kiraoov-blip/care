<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARE</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#f3f6fa; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Pretendard",sans-serif;
    display:flex; flex-direction:column;
  }

  /* 상단 바 — 브랜드 없이 기능만: 새 탭 열기 도피구를 항상 보이게 둔다.
     Streamlit 무료 티어는 프레임 차단 헤더를 설정할 수도 있고, 콜드스타트가
     느릴 수도 있다. 어느 경우든 사용자가 원본으로 바로 빠져나갈 길이 필요하다. */
  .topbar {
    flex:0 0 auto; height:44px; display:flex; align-items:center; justify-content:flex-end;
    gap:10px; padding:0 14px; background:#0e2036; color:#c7d3e3; font-size:12.5px;
  }
  .topbar a {
    color:#eaf2ff; text-decoration:none; font-weight:600;
    display:inline-flex; align-items:center; gap:5px;
    padding:5px 10px; border-radius:7px; background:rgba(255,255,255,.08);
  }
  .topbar a:hover { background:rgba(255,255,255,.16); }

  .stage { position:relative; flex:1 1 auto; min-height:0; }
  iframe {
    position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff;
  }

  /* 로딩 오버레이 — Streamlit 커뮤니티 클라우드는 방문이 없으면 앱을 재우고,
     깨어나는 데 30초~1분 정도 걸릴 수 있다. */
  .veil {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; background:#f3f6fa; text-align:center; padding:24px;
    transition:opacity .25s ease;
  }
  .veil.hidden { opacity:0; pointer-events:none; }
  .spinner {
    width:34px; height:34px; border-radius:50%;
    border:3px solid #d5deea; border-top-color:#2168df;
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .veil p { color:#516075; font-size:13.5px; line-height:1.6; max-width:34ch; }
  .veil .slow { display:none; color:#8b97a7; font-size:12px; }
  .veil.slow .slow { display:block; }
  .veil .fallback {
    display:none; margin-top:2px; color:#2168df; font-weight:700; font-size:13px;
    text-decoration:none; padding:8px 16px; border:1px solid #b9d5ff; border-radius:9px;
    background:#eef5ff;
  }
  .veil.slow .fallback { display:inline-block; }

  @media (prefers-color-scheme: dark) {
    html, body { background:#0a1420; }
    .veil { background:#0a1420; }
    .veil p { color:#a9bace; }
    .veil .slow { color:#75899f; }
    .spinner { border-color:#25384f; border-top-color:#5fa0f0; }
    .veil .fallback { background:#16283f; border-color:#2a3f5c; color:#5fa0f0; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <a href="https://care-jeju-v30.streamlit.app" target="_blank" rel="noopener">새 탭에서 열기 ↗</a>
  </div>

  <div class="stage">
    <div class="veil" id="veil">
      <div class="spinner" aria-hidden="true"></div>
      <p>불러오는 중입니다…</p>
      <p class="slow">
        예상보다 오래 걸리고 있습니다. 서버가 방금 깨어나는 중이거나
        이 화면에 표시할 수 없는 설정일 수 있습니다.
      </p>
      <a class="fallback" href="https://care-jeju-v30.streamlit.app" target="_blank" rel="noopener">
        새 탭에서 바로 열기 ↗
      </a>
    </div>
    <iframe
      id="careFrame"
      src="https://care-jeju-v30.streamlit.app/?embed=true"
      title="CARE"
      loading="eager"
      allow="clipboard-write"
    ></iframe>
  </div>

  <script>
    var veil = document.getElementById("veil");
    var frame = document.getElementById("careFrame");
    var SLOW_AFTER_MS = 12000; // 12초 넘게 안 뜨면 "느림/차단 가능" 안내로 전환

    var slowTimer = setTimeout(function () {
      veil.classList.add("slow");
    }, SLOW_AFTER_MS);

    // 교차출처(iframe) 문서라 내부 로딩 완료를 정확히 알 수 없다.
    // load 이벤트는 실제 콘텐츠가 뜬 경우와 프레임 차단으로 빈 응답이
    // 온 경우를 구분하지 못하므로, 오버레이는 걷어내되 상단의
    // "새 탭에서 열기"는 항상 남겨 둔다.
    frame.addEventListener("load", function () {
      clearTimeout(slowTimer);
      veil.classList.add("hidden");
    });
  </script>

</body>
</html>
